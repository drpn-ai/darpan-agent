/*
 * Darpan embedded agent component (DAR-BE-159). Pins the Anthropic Java SDK in its own lib/.
 */

apply plugin: 'groovy'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

def componentNode = parseComponent(project)
version = componentNode.'@version'
def jarBaseName = componentNode.'@name'
def moquiDir = projectDir.parentFile.parentFile.parentFile
def frameworkDir = file(moquiDir.absolutePath + '/framework')

repositories {
    flatDir name: 'localLib', dirs: frameworkDir.absolutePath + '/lib'
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content { includeModule('com.github.saasquatch', 'json-schema-inferrer') }
    }
}

sourceSets {
    main { groovy { srcDirs = ['src/main/groovy'] } }
    test { groovy { srcDirs = ['src/test/groovy'] } }
}

tasks.withType(JavaCompile) { options.compilerArgs << "-proc:none" }
tasks.withType(GroovyCompile) { options.compilerArgs << "-proc:none" }

configurations.all {
    resolutionStrategy.eachDependency { details ->
        // The framework pins jackson-databind 2.20.1 (framework/build.gradle); every jackson module must agree.
        if (details.requested.group == 'com.fasterxml.jackson' || details.requested.group.startsWith('com.fasterxml.jackson.')) {
            // jackson-annotations is released as 2.20 (no patch), per jackson-bom 2.20.1.
            details.useVersion(details.requested.name == 'jackson-annotations' ? '2.20' : '2.20.1')
        }
    }
}

dependencies {
    implementation project(':framework')
    // Moqui loads darpan on the shared classloader; compile against it only (moqui-gql style).
    compileOnly project(':runtime:component:darpan')
    implementation 'com.anthropic:anthropic-java:3.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation project(':runtime:component:darpan')
    testImplementation project(':runtime:component:darpan').sourceSets.test.output
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.2' // capture log output in the key-leak test (test only)
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    testRuntimeOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

check.dependsOn.clear()

test {
    useJUnitPlatform()
    // Each test class boots its own Moqui (ReconciliationSmokeTestSupport.initMoqui), as core's tests do.
    forkEvery = 1
    // R6: the prompt leak test reads the private tenant identifier list (and allow phrases) only from here; without it the
    // test is skipped, not passed. DARPAN_AGENT_LEAK_LIST = path(s) separated by the path separator: *.json identifiers, *.txt
    // allow phrases.
    def leakList = System.getenv('DARPAN_AGENT_LEAK_LIST')
    if (leakList) systemProperty 'darpan.agent.leakListPath', leakList
}

// DAR-BE-159 Task 10: the agent eval (darpan.agent.evals.AgentEvalRunner over src/evals). Opt-in and never part of `test`
// or `check` (nothing depends on it; the runner is a main class with no tests, so `test` never executes it). Without
// -PagentEvalConfirm=yes it boots Moqui, seeds the synthetic tenant, prints a cost estimate measured offline (a recording
// gateway; no request is sent) and stops. With it, every case runs 3 times against the real Claude API (key from the
// environment, ANTHROPIC_API_KEY) and the report goes to build/agent-eval/<timestamp>/. Spend stops at
// -PagentEvalBudgetUsd (default 25, applied as the eval tenant's daily cap). -PagentEvalCases=id,id runs a subset (no gate).
tasks.register('agentEval', JavaExec) {
    group = 'darpan agent'
    description = 'Agent eval: prints a cost estimate; runs the paid eval only with -PagentEvalConfirm=yes.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'darpan.agent.evals.AgentEvalRunner'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'darpan.agent.evalConfirm', (project.findProperty('agentEvalConfirm') ?: '').toString()
    systemProperty 'darpan.agent.evalDir', file('src/evals').absolutePath
    systemProperty 'darpan.agent.evalReportDir', layout.buildDirectory.dir('agent-eval').get().asFile.absolutePath
    if (project.hasProperty('agentEvalBudgetUsd')) systemProperty 'darpan.agent.evalBudgetUsd', project.property('agentEvalBudgetUsd').toString()
    if (project.hasProperty('agentEvalCases')) systemProperty 'darpan.agent.evalCases', project.property('agentEvalCases').toString()
    outputs.upToDateWhen { false }
}

task cleanLib(type: Delete) { delete fileTree(dir: projectDir.absolutePath + '/lib', include: '*') }
clean.dependsOn cleanLib

jar {
    destinationDirectory = file(projectDir.absolutePath + '/lib')
    archiveBaseName = jarBaseName
}

task copyDependencies {
    doLast {
        copy {
            from (configurations.runtimeClasspath
                    - project(':framework').configurations.runtimeClasspath
                    - project(':framework').tasks.named('jar').get().archiveFile.get().asFile
                    - project(':runtime:component:darpan').configurations.runtimeClasspath
                    - project(':runtime:component:darpan').tasks.named('jar').get().archiveFile.get().asFile)
            into file(projectDir.absolutePath + '/lib')
        }
    }
}
copyDependencies.dependsOn cleanLib
jar.dependsOn copyDependencies
